name: Pull request validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    # Playwright 1.56.1 supports Noble; ubuntu-latest now resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run runtime and packaging smoke tests
        run: npm test
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test playlist lifecycle in Chromium
        run: node tests/playlist-browser.cjs
      - name: Build container image
        run: docker build --tag channelforge:pr .
